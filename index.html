<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BRYCER 2026 Content Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#03233D;
  --orange:#E17F49;
  --bg:#F4F7FB;
  --card:#FFFFFF;
  --surface2:#F8FAFC;
  --border:#E2E8F0;
  --border2:#CBD5E1;
  --text:#0F172A;
  --muted:#64748B;
  --dim:#94A3B8;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Lato',system-ui,sans-serif;}
.hdr{background:var(--navy);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:200;}
.logo{display:flex;flex-direction:column;justify-content:center;gap:0;}
.logo-sub{font-size:.65rem;color:rgba(255,255,255,.4);font-family:'DM Mono',monospace;margin-top:3px;letter-spacing:.1em;text-transform:uppercase;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.view-seg{display:flex;border:1px solid rgba(255,255,255,.2);border-radius:8px;overflow:hidden;}
.view-btn{font-family:'Syne',sans-serif;font-size:.75rem;font-weight:600;padding:7px 16px;border:none;background:transparent;color:rgba(255,255,255,.5);cursor:pointer;transition:all .15s;letter-spacing:.06em;}
.view-btn.active{background:var(--orange);color:#fff;}
.total-pill{font-family:'DM Mono',monospace;font-size:.72rem;background:rgba(225,127,73,.2);color:var(--orange);border:1px solid rgba(225,127,73,.4);padding:4px 12px;border-radius:999px;white-space:nowrap;}
.layout{display:flex;align-items:flex-start;min-height:calc(100vh - 64px);}
.sidebar{width:220px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;}
.sidebar-section{margin-bottom:20px;}
.sidebar-label{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;display:block;}
.fchip{display:flex;align-items:center;gap:7px;width:100%;font-size:.74rem;font-weight:600;padding:5px 9px;border-radius:7px;border:1.5px solid transparent;background:transparent;color:var(--muted);cursor:pointer;transition:all .12s;white-space:nowrap;user-select:none;text-align:left;margin-bottom:3px;}
.fchip:hover{background:var(--bg);color:var(--text);}
.fchip.active{color:#fff;border-color:transparent;}
.fchip .chip-dot{width:8px;height:8px;border-radius:999px;flex-shrink:0;}
.fchip-type{display:flex;align-items:center;gap:7px;width:100%;font-size:.74rem;font-weight:600;padding:5px 9px;border-radius:7px;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;transition:all .12s;white-space:nowrap;user-select:none;text-align:left;margin-bottom:3px;}
.fchip-type:hover{border-color:var(--border2);color:var(--text);}
.fchip-type.active{border-color:var(--navy);background:var(--navy);color:#fff;}
.main-area{flex:1;min-width:0;}
.ctrl-bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:64px;z-index:199;box-shadow:0 1px 4px rgba(2,6,23,.05);}
.ctrl-group{display:flex;align-items:center;gap:7px;}
.ctrl-label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;}
.spacer{flex:1;}
input[type=text]{font-family:'Lato',sans-serif;font-size:.8rem;padding:6px 10px;background:#fff;border:1px solid var(--border2);border-radius:7px;color:var(--text);outline:none;transition:border-color .12s;}
input:focus{border-color:var(--orange);}
select{font-family:'Lato',sans-serif;font-size:.8rem;padding:6px 10px;background:#fff;border:1px solid var(--border2);border-radius:7px;color:var(--text);outline:none;cursor:pointer;transition:border-color .12s;}
select:focus{border-color:var(--orange);}
.btn-reset{font-family:'Syne',sans-serif;font-size:.73rem;font-weight:600;padding:6px 14px;border:1px solid var(--border2);border-radius:7px;background:#fff;color:var(--muted);cursor:pointer;transition:all .12s;}
.btn-reset:hover{border-color:var(--orange);color:var(--orange);}
.mnav{display:flex;align-items:center;border:1px solid var(--border2);border-radius:8px;overflow:hidden;}
.mnav-btn{font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700;padding:6px 13px;border:none;background:#fff;color:var(--navy);cursor:pointer;transition:background .12s;}
.mnav-btn:hover{background:var(--bg);}
.mnav-label{padding:6px 16px;font-family:'Syne',sans-serif;font-size:.82rem;font-weight:700;color:var(--navy);white-space:nowrap;min-width:150px;text-align:center;background:var(--surface2);border-left:1px solid var(--border2);border-right:1px solid var(--border2);}
.cal-wrap{padding:16px 20px 40px;}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
.dow-cell{text-align:center;padding:6px 4px;font-family:'Syne',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
.dow-cell.is-wed{color:var(--orange);}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:start;}
.day-cell{background:var(--card);border:1px solid var(--border);border-radius:10px;min-height:100px;padding:8px 7px;transition:border-color .12s,box-shadow .12s;position:relative;overflow:visible;}
.day-cell:hover{border-color:var(--border2);box-shadow:0 4px 16px rgba(2,6,23,.07);}
.day-cell.other-month{background:var(--surface2);opacity:.5;}
.day-cell.today{border-color:var(--orange);box-shadow:0 0 0 2px rgba(225,127,73,.15);}
.day-cell.today::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--orange);border-radius:10px 10px 0 0;}
.day-cell.is-wed-cell{background:#FFFDF8;}
.day-num{font-family:'Syne',sans-serif;font-size:.85rem;font-weight:700;color:var(--navy);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.today-badge{font-family:'DM Mono',monospace;font-size:.52rem;font-weight:500;background:var(--orange);color:#fff;padding:1px 5px;border-radius:3px;letter-spacing:.04em;}
.wed-dot{width:5px;height:5px;border-radius:999px;background:var(--orange);opacity:.35;flex-shrink:0;}
.ev-pill{font-size:.72rem;line-height:1.35;padding:4px 7px 4px 9px;border-radius:6px;margin-bottom:4px;cursor:pointer;border-left:3px solid transparent;background:var(--surface2);color:var(--text);transition:all .1s;display:block;overflow:visible;}
.ev-pill:hover{filter:brightness(.96);transform:translateX(1px);}
.ev-type-label{font-family:'DM Mono',monospace;font-size:.58rem;opacity:.5;display:block;margin-bottom:1px;text-transform:uppercase;letter-spacing:.07em;}
.ev-title-text{font-weight:700;display:block;color:var(--navy);font-size:.73rem;}
.more-tag{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--orange);cursor:pointer;padding:3px 7px;border-radius:5px;display:inline-block;margin-top:2px;background:rgba(225,127,73,.1);border:1px solid rgba(225,127,73,.3);font-weight:600;transition:all .12s;}
.more-tag:hover{background:rgba(225,127,73,.2);}
.day-pop-bg{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(4px);z-index:900;display:none;align-items:center;justify-content:center;padding:24px;}
.day-pop-bg.open{display:flex;}
.day-pop{background:#fff;border:1px solid var(--border2);border-radius:14px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;padding:22px;position:relative;box-shadow:0 20px 50px rgba(2,6,23,.15);animation:popIn .15s ease;}
@keyframes popIn{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
.day-pop-x{position:absolute;top:10px;right:10px;width:26px;height:26px;background:none;border:none;cursor:pointer;font-size:.9rem;color:var(--dim);border-radius:5px;display:flex;align-items:center;justify-content:center;}
.day-pop-x:hover{color:var(--text);background:var(--bg);}
.day-pop-date{font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700;color:var(--orange);margin-bottom:12px;letter-spacing:.04em;}
.day-pop-item{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:8px;margin-bottom:6px;cursor:pointer;border-left:4px solid transparent;background:var(--surface2);transition:all .12s;}
.day-pop-item:hover{box-shadow:0 2px 8px rgba(2,6,23,.08);}
.day-pop-item-type{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;}
.day-pop-item-title{font-family:'Syne',sans-serif;font-size:.82rem;font-weight:700;color:var(--navy);line-height:1.3;}
.day-pop-item-bucket{font-size:.72rem;color:var(--muted);margin-top:1px;}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(6px);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border:1px solid var(--border2);border-radius:16px;max-width:500px;width:100%;padding:28px;position:relative;box-shadow:0 24px 60px rgba(2,6,23,.15);animation:modalIn .18s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.modal-x{position:absolute;top:12px;right:12px;width:28px;height:28px;background:none;border:none;cursor:pointer;font-size:1rem;color:var(--dim);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.modal-x:hover{color:var(--text);background:var(--bg);}
.modal-eyebrow{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--dim);margin-bottom:6px;letter-spacing:.06em;}
.modal-title{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:700;color:var(--navy);line-height:1.35;margin-bottom:14px;}
.modal-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.modal-divider{border:none;border-top:1px solid var(--border);margin:14px 0;}
.modal-field{margin-bottom:12px;}
.modal-field-label{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.modal-field-val{font-size:.84rem;color:var(--muted);line-height:1.5;}
.list-wrap{padding:24px 20px 48px;}
.list-month-block{margin-bottom:32px;}
.list-month-hdr{display:flex;align-items:baseline;gap:12px;font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800;color:var(--navy);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--orange);}
.list-month-hdr small{font-size:.72rem;font-weight:400;color:var(--dim);font-family:'DM Mono',monospace;}
.list-thead{display:grid;grid-template-columns:80px 170px 130px 1fr 140px 90px;gap:10px;padding:5px 12px;font-family:'DM Mono',monospace;font-size:.62rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.list-row{display:grid;grid-template-columns:80px 170px 130px 1fr 140px 90px;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:all .12s;align-items:center;margin-bottom:3px;background:#fff;}
.list-row:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(2,6,23,.06);}
.lcol-date{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--dim);}
.lcol-bucket{font-size:.74rem;font-weight:700;}
.lcol-title{font-size:.82rem;font-weight:600;color:var(--text);line-height:1.3;}
.lcol-audience{font-size:.73rem;color:var(--muted);}
.type-badge,.status-badge{font-family:'DM Mono',monospace;font-size:.65rem;font-weight:500;padding:3px 8px;border-radius:999px;border:1px solid transparent;display:inline-block;}
.tb-Email{background:#DBEAFE;color:#1E3A8A;border-color:#93C5FD;}
.tb-Blog{background:#FDE8F0;color:#9D174D;border-color:#F9A8D4;}
.tb-Social{background:#FEF3C7;color:#78350F;border-color:#FCD34D;}
.tb-Webinar{background:#EDE9FE;color:#3730A3;border-color:#A5B4FC;}
.tb-New-Service{background:#D1FAE5;color:#064E3B;border-color:#34D399;}
.tb-Conference{background:#E0E7FF;color:#312E81;border-color:#818CF8;}
.tb-Speaking{background:#FFF7ED;color:#7C2D12;border-color:#FB923C;}
.tb-Podcast{background:#CFFAFE;color:#164E63;border-color:#22D3EE;}
.tb-Holiday{background:#CCFBF1;color:#134E4A;border-color:#2DD4BF;}
.tb-Ad{background:#FEF9C3;color:#713F12;border-color:#EAB308;}
.tb-Press-Release{background:#FEF9C3;color:#713F12;border-color:#CA8A04;}
.tb-default{background:#F1F5F9;color:#475569;border-color:#CBD5E1;}
.sb-Sent{background:#DCFCE7;color:#14532D;border-color:#86EFAC;}
.sb-Scheduled{background:#FEF3C7;color:#92400E;border-color:#FDE68A;}
.sb-Planned{background:#DBEAFE;color:#1E40AF;border-color:#BFDBFE;}

.btn-add{font-family:'Syne',sans-serif;font-size:.75rem;font-weight:700;padding:7px 16px;border:none;background:var(--orange);color:#fff;border-radius:8px;cursor:pointer;letter-spacing:.04em;transition:all .15s;}
.btn-add:hover{background:#d06a32;}
.btn-export{font-family:'Syne',sans-serif;font-size:.75rem;font-weight:700;padding:7px 16px;border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.7);border-radius:8px;cursor:pointer;letter-spacing:.04em;transition:all .15s;}
.btn-export:hover{background:rgba(255,255,255,.1);color:#fff;}
.modal-actions{display:flex;gap:8px;margin-top:18px;}
.btn-edit{font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;padding:8px 18px;border:1.5px solid var(--navy);border-radius:8px;background:#fff;color:var(--navy);cursor:pointer;flex:1;transition:all .12s;}
.btn-edit:hover{background:var(--navy);color:#fff;}
.btn-delete{font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;padding:8px 18px;border:1.5px solid #DC2626;border-radius:8px;background:#fff;color:#DC2626;cursor:pointer;flex:1;transition:all .12s;}
.btn-delete:hover{background:#DC2626;color:#fff;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-row.full{grid-template-columns:1fr;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-label{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;}
.form-input,.form-select,.form-textarea{font-family:'Lato',sans-serif;font-size:.82rem;padding:7px 10px;border:1.5px solid var(--border2);border-radius:7px;color:var(--text);background:#fff;outline:none;transition:border-color .12s;width:100%;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--orange);}
.form-textarea{resize:vertical;min-height:64px;}
.form-submit{font-family:'Syne',sans-serif;font-size:.82rem;font-weight:700;padding:10px 20px;background:var(--orange);color:#fff;border:none;border-radius:8px;cursor:pointer;transition:all .12s;width:100%;margin-top:4px;}
.form-submit:hover{background:#d06a32;}
.confirm-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:1100;display:none;align-items:center;justify-content:center;}
.confirm-bg.open{display:flex;}
.confirm-box{background:#fff;border-radius:14px;padding:28px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(2,6,23,.2);}
.confirm-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:8px;}
.confirm-msg{font-size:.84rem;color:var(--muted);margin-bottom:20px;line-height:1.5;}
.confirm-btns{display:flex;gap:10px;}
.confirm-cancel{flex:1;font-family:'Syne',sans-serif;font-size:.78rem;font-weight:600;padding:9px;border:1.5px solid var(--border2);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer;}
.confirm-cancel:hover{border-color:var(--navy);color:var(--navy);}
.confirm-ok{flex:1;font-family:'Syne',sans-serif;font-size:.78rem;font-weight:600;padding:9px;border:none;border-radius:8px;background:#DC2626;color:#fff;cursor:pointer;}
.confirm-ok:hover{background:#b91c1c;}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">
    <img src="https://raw.githubusercontent.com/probson-ship-it/BRYCER-email-roadmap/main/BRYCER_logo_white_transparent%20(5).png" alt="BRYCER" style="height:38px;width:auto;display:block;"/>
    <div class="logo-sub">2026 Content Calendar</div>
  </div>
  <div class="hdr-right">
    <div class="total-pill" id="totalPill">— items</div>
    <button class="btn-refresh" onclick="refreshSheets()" id="btnRefresh" title="Reload from Google Sheets" style="font-family:'Syne',sans-serif;font-size:.75rem;font-weight:700;padding:7px 12px;border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.7);border-radius:8px;cursor:pointer;letter-spacing:.04em;transition:all .15s;">&#8635; Sync</button>
    <button class="btn-export" onclick="exportHTML()">&#8681; Export HTML</button>
    <button class="btn-add" onclick="openAddModal()">+ Add Event</button>
    <div class="view-seg">
      <button class="view-btn active" id="btnCal" onclick="setView('cal')">Calendar</button>
      <button class="view-btn" id="btnList" onclick="setView('list')">List</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <span class="sidebar-label">Content Types</span>
      <div id="typeChips"></div>
    </div>
    <div class="sidebar-section">
      <span class="sidebar-label">Campaigns</span>
      <div id="bucketChips"></div>
    </div>
  </aside>

  <div class="main-area">
    <div class="ctrl-bar">
      <div class="ctrl-group">
        <div class="mnav">
          <button class="mnav-btn" onclick="changeMonth(-1)">&#8592;</button>
          <span class="mnav-label" id="mnLabel"></span>
          <button class="mnav-btn" onclick="changeMonth(1)">&#8594;</button>
        </div>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">Status</span>
        <select id="fStatus" onchange="applyFilters()">
          <option value="">All</option><option>Sent</option><option>Scheduled</option><option>Planned</option>
        </select>
      </div>
      <div class="ctrl-group">
        <input type="text" id="fSearch" placeholder="&#128269; Search..." oninput="applyFilters()" style="width:180px;"/>
      </div>
      <div class="spacer"></div>
      <button class="btn-reset" onclick="resetFilters()">Reset All</button>
    </div>

    <div id="viewCal">
      <div class="cal-wrap">
        <div class="dow-row">
          <div class="dow-cell">Sun</div>
          <div class="dow-cell">Mon</div>
          <div class="dow-cell">Tue</div>
          <div class="dow-cell is-wed">Wed &#9679;</div>
          <div class="dow-cell">Thu</div>
          <div class="dow-cell">Fri</div>
          <div class="dow-cell">Sat</div>
        </div>
        <div class="day-grid" id="dayGrid"></div>
      </div>
    </div>

    <div id="viewList" style="display:none;">
      <div class="list-wrap">
        <div class="list-thead">
          <div>Date</div><div>Campaign</div><div>Type</div><div>Title</div><div>Audience</div><div>Status</div>
        </div>
        <div id="listBody"></div>
      </div>
    </div>
  </div>
</div>

<div class="day-pop-bg" id="dayPopBg" onclick="closeDayPop(event)">
  <div class="day-pop">
    <button class="day-pop-x" onclick="closeDayPopDirect()">&#x2715;</button>
    <div class="day-pop-date" id="dayPopDate"></div>
    <div id="dayPopItems"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="closeMaybe(event)">
  <div class="modal">
    <button class="modal-x" onclick="closeModal()">&#x2715;</button>
    <div class="modal-eyebrow" id="mDate"></div>
    <div class="modal-title" id="mTitle"></div>
    <div class="modal-chips" id="mChips"></div>
    <hr class="modal-divider"/>
    <div class="modal-field"><div class="modal-field-label">Campaign</div><div class="modal-field-val" id="mBucket"></div></div>
    <div class="modal-field"><div class="modal-field-label">Audience</div><div class="modal-field-val" id="mAudience"></div></div>
    <div class="modal-field"><div class="modal-field-label">Notes</div><div class="modal-field-val" id="mNotes"></div></div>
    <div class="modal-actions"><button class="btn-edit" onclick="openEditModal()">Edit</button><button class="btn-delete" onclick="openDeleteConfirm()">Delete</button></div>
  </div>

function typeSlug(t){return(t||'').replace(/[^a-zA-Z0-9]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')||'default';}
const TODAY=new Date();TODAY.setHours(0,0,0,0);
let curMonth=4,curYear=2026;
let activeBuckets=new Set(), activeTypes=new Set();
let fStatus='', fSearch='', activeView='cal';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function init(){
  const buckets=[...new Set(EVENTS.map(e=>e.bucket).filter(Boolean))].sort();
  const types=[...new Set(EVENTS.map(e=>e.type).filter(Boolean))].sort();
  const tc=document.getElementById('typeChips');
  types.forEach(t=>{
    const col=TYPE_COLOR[t]||DEFAULT_COLOR;
    const chip=document.createElement('button');
    chip.className='fchip'; chip.dataset.type=t;
    chip.innerHTML=`<span class="chip-dot" style="background:${col}"></span><span style="overflow:hidden;text-overflow:ellipsis;">${t}</span>`;
    chip.onclick=()=>toggleType(t,col,chip);
    tc.appendChild(chip);
  });
  const bc=document.getElementById('bucketChips');
  buckets.forEach(b=>{
    const chip=document.createElement('button');
    chip.className='fchip-type'; chip.dataset.bucket=b;
    chip.textContent=b;
    chip.onclick=()=>toggleBucket(b,chip);
    bc.appendChild(chip);
  });
  render();
}

function toggleType(t,col,chip){
  if(activeTypes.has(t)){activeTypes.delete(t);chip.classList.remove('active');chip.style.background='';chip.style.color='';}
  else{activeTypes.add(t);chip.classList.add('active');chip.style.background=col;chip.style.color='#fff';}
  applyFilters();
}
function toggleBucket(b,chip){
  if(activeBuckets.has(b)){activeBuckets.delete(b);chip.classList.remove('active');}
  else{activeBuckets.add(b);chip.classList.add('active');}
  applyFilters();
}
function applyFilters(){
  fStatus=document.getElementById('fStatus').value;
  fSearch=document.getElementById('fSearch').value.toLowerCase().trim();
  render();
}
function resetFilters(){
  activeBuckets.clear();activeTypes.clear();fStatus='';fSearch='';
  document.getElementById('fStatus').value='';
  document.getElementById('fSearch').value='';
  document.querySelectorAll('.fchip').forEach(c=>{c.classList.remove('active');c.style.background='';c.style.color='';});
  document.querySelectorAll('.fchip-type').forEach(c=>c.classList.remove('active'));
  render();
}
function passes(e){
  if(activeBuckets.size>0 && !activeBuckets.has(e.bucket)) return false;
  if(activeTypes.size>0   && !activeTypes.has(e.type))     return false;
  if(fStatus && e.status!==fStatus) return false;
  if(fSearch && !((e.title||'').toLowerCase().includes(fSearch)||(e.bucket||'').toLowerCase().includes(fSearch)||(e.audience||'').toLowerCase().includes(fSearch)||(e.notes||'').toLowerCase().includes(fSearch))) return false;
  return true;
}
function render(){
  const visible=EVENTS.filter(passes);
  document.getElementById('totalPill').textContent=visible.length+' item'+(visible.length!==1?'s':'');
  document.getElementById('mnLabel').textContent=MONTHS[curMonth]+' '+curYear;
  if(activeView==='cal') renderCal();
  else renderList(visible);
}
function renderCal(){
  const byDate={};
  EVENTS.forEach(e=>{if(!byDate[e.date])byDate[e.date]=[];byDate[e.date].push(e);});
  const grid=document.getElementById('dayGrid');grid.innerHTML='';
  const first=new Date(curYear,curMonth,1).getDay();
  const days=new Date(curYear,curMonth+1,0).getDate();
  const prevDays=new Date(curYear,curMonth,0).getDate();
  for(let i=0;i<first;i++){
    const c=document.createElement('div');c.className='day-cell other-month';
    c.innerHTML=`<div class="day-num">${prevDays-first+i+1}</div>`;grid.appendChild(c);
  }
  for(let d=1;d<=days;d++){
    const ds=curYear+'-'+String(curMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dt=new Date(curYear,curMonth,d);
    const isToday=dt.getTime()===TODAY.getTime();
    const isWed=dt.getDay()===3;
    const cell=document.createElement('div');
    cell.className='day-cell'+(isToday?' today':'')+(isWed?' is-wed-cell':'');
    let html=`<div class="day-num">${d}${isToday?'<span class="today-badge">TODAY</span>':(isWed?'<span class="wed-dot"></span>':'')}</div>`;
    const entries=byDate[ds]||[];
    const visEntries=entries.filter(passes);
    const shown=visEntries.slice(0,MAX_PILLS);
    const extra=visEntries.length-MAX_PILLS;
    shown.forEach(ev=>{
      const col=BUCKET_COLOR[ev.bucket]||DEFAULT_COLOR;
      const short=ev.title.length>38?ev.title.slice(0,38)+'…':ev.title;
      const idx=EVENTS.indexOf(ev);
      html+=`<div class="ev-pill" style="border-left-color:${col};background:${col}14;" onclick="openModal(EVENTS[${idx}])">
        <span class="ev-type-label">${ev.type}</span>
        <span class="ev-title-text">${short}</span>
      </div>`;
    });
    if(extra>0) html+=`<span class="more-tag" onclick="openDayPop('${ds}',event)">+${extra} more</span>`;
    cell.innerHTML=html;grid.appendChild(cell);
  }
  const total=first+days;
  const rem=total%7===0?0:7-(total%7);
  for(let i=1;i<=rem;i++){
    const c=document.createElement('div');c.className='day-cell other-month';
    c.innerHTML=`<div class="day-num">${i}</div>`;grid.appendChild(c);
  }
}
function openDayPop(ds,evt){
  evt&&evt.stopPropagation();
  const byDate={};
  EVENTS.forEach(e=>{if(!byDate[e.date])byDate[e.date]=[];byDate[e.date].push(e);});
  const allDay=(byDate[ds]||[]).filter(passes);
  const d=new Date(ds+'T00:00:00');
  const label=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  document.getElementById('dayPopDate').textContent=label;
  const container=document.getElementById('dayPopItems');container.innerHTML='';
  allDay.forEach(ev=>{
    const col=BUCKET_COLOR[ev.bucket]||DEFAULT_COLOR;
    const item=document.createElement('div');item.className='day-pop-item';
    item.style.borderLeftColor=col;
    item.innerHTML=`<div class="day-pop-item-type">${ev.type}</div>
      <div class="day-pop-item-title">${ev.title}</div>
      <div class="day-pop-item-bucket" style="color:${col}">${ev.bucket}</div>`;
    item.onclick=()=>{closeDayPopDirect();openModal(ev);};
    container.appendChild(item);
  });
  document.getElementById('dayPopBg').classList.add('open');
}
function closeDayPop(e){if(e.target===document.getElementById('dayPopBg'))closeDayPopDirect();}
function closeDayPopDirect(){document.getElementById('dayPopBg').classList.remove('open');}
function renderList(visible){
  const body=document.getElementById('listBody');body.innerHTML='';
  const groups={};
  visible.forEach(e=>{
    if(!e.date||e.date.length<7)return;
    const k=e.date.slice(0,7);
    if(!groups[k])groups[k]=[];
    groups[k].push(e);
  });
  const keys=Object.keys(groups).sort();
  keys.forEach(k=>{
    const[yr,mo]=k.split('-');
    const items=groups[k].sort((a,b)=>a.date.localeCompare(b.date));
    const block=document.createElement('div');block.className='list-month-block';
    let html=`<div class="list-month-hdr">${MONTHS[parseInt(mo)-1]} ${yr}<small>${items.length} item${items.length!==1?'s':''}</small></div>`;
    items.forEach(e=>{
      const col=BUCKET_COLOR[e.bucket]||DEFAULT_COLOR;
      const tslug=typeSlug(e.type);
      const dateDisp=MON3[parseInt(e.date.slice(5,7))-1]+' '+parseInt(e.date.slice(8,10));
      const idx=EVENTS.indexOf(e);
      html+=`<div class="list-row" style="border-left:3px solid ${col}" onclick="openModal(EVENTS[${idx}])">
        <div class="lcol-date">${dateDisp}</div>
        <div class="lcol-bucket" style="color:${col}">${e.bucket}</div>
        <div><span class="type-badge tb-${tslug}">${e.type}</span></div>
        <div class="lcol-title">${e.title}</div>
        <div class="lcol-audience">${e.audience||'—'}</div>
        <div><span class="status-badge sb-${e.status}">${e.status}</span></div>
      </div>`;
    });
    block.innerHTML=html;body.appendChild(block);
  });
  if(!keys.length) body.innerHTML='<div style="text-align:center;padding:60px;color:var(--dim);font-family:DM Mono,monospace;font-size:.85rem;">No items match the current filters.</div>';
}

// ── Google Sheets Config ──────────────────────────────────────────────────────
// Replace these two values with your own (see setup instructions)
const SHEETS_API_KEY   = 'AIzaSyDuo8wPa0vieHW9HWzfZgXaGTMAImBxJGw';
const SHEETS_SHEET_ID  = '10xa91Ua-Gay_zUeWDpXPnPjACBLlFU4luZNgS4m7nOI';
const SHEETS_RANGE     = 'Sheet1!A2:G'; // skip header row

let EVENTS_SOURCE = 'local'; // 'sheets' or 'local'
let _loadError = false;

async function loadFromSheets() {
  if (SHEETS_API_KEY === 'AIzaSyDuo8wPa0vieHW9HWzfZgXaGTMAImBxJGw' || SHEETS_SHEET_ID === '10xa91Ua-Gay_zUeWDpXPnPjACBLlFU4luZNgS4m7nOI') {
    return false; // not configured yet
  }
  try {
    showLoadingBanner('Loading from Google Sheets...');
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_SHEET_ID}/values/${SHEETS_RANGE}?key=${SHEETS_API_KEY}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Sheets API error: ' + res.status);
    const data = await res.json();
    const rows = data.values || [];
    // Columns: date | bucket | type | title | audience | notes | status
    const parsed = rows
      .filter(r => r[0] && r[3]) // must have date + title
      .map(r => ({
        date:     (r[0] || '').trim(),
        bucket:   (r[1] || 'General').trim(),
        type:     (r[2] || 'Email').trim(),
        title:    (r[3] || '').trim(),
        audience: (r[4] || '—').trim(),
        notes:    (r[5] || '').trim(),
        status:   (r[6] || 'Planned').trim(),
      }));
    if (parsed.length === 0) throw new Error('No data rows found');
    // Replace the EVENTS array in place
    EVENTS.length = 0;
    parsed.forEach(e => EVENTS.push(e));
    EVENTS_SOURCE = 'sheets';
    hideLoadingBanner();
    showSourceBadge('sheets');
    return true;
  } catch(err) {
    console.warn('Sheets load failed:', err);
    hideLoadingBanner();
    showSourceBadge('local');
    _loadError = true;
    return false;
  }
}

function showLoadingBanner(msg) {
  let b = document.getElementById('loadBanner');
  if (!b) {
    b = document.createElement('div');
    b.id = 'loadBanner';
    b.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-family:DM Mono,monospace;font-size:.72rem;padding:8px 20px;border-radius:99px;z-index:9999;letter-spacing:.06em;box-shadow:0 4px 20px rgba(2,6,23,.2);';
    document.body.appendChild(b);
  }
  b.textContent = msg;
  b.style.display = 'block';
}
function hideLoadingBanner() {
  const b = document.getElementById('loadBanner');
  if (b) b.style.display = 'none';
}
function showSourceBadge(source) {
  let badge = document.getElementById('sourceBadge');
  if (!badge) {
    badge = document.createElement('div');
    badge.id = 'sourceBadge';
    badge.style.cssText = 'font-family:DM Mono,monospace;font-size:.62rem;padding:4px 10px;border-radius:999px;border:1px solid;letter-spacing:.06em;cursor:default;';
    document.querySelector('.hdr-right').prepend(badge);
  }
  if (source === 'sheets') {
    badge.textContent = '⬤ Live — Google Sheets';
    badge.style.background = 'rgba(5,150,105,.15)';
    badge.style.color = '#34d399';
    badge.style.borderColor = 'rgba(52,211,153,.3)';
    badge.title = 'Data loaded from Google Sheets. Refresh to sync latest changes.';
  } else {
    badge.textContent = '⬤ Local data';
    badge.style.background = 'rgba(100,116,139,.15)';
    badge.style.color = '#94a3b8';
    badge.style.borderColor = 'rgba(148,163,184,.3)';
    badge.title = _loadError
      ? 'Could not reach Google Sheets. Showing local fallback data.'
      : 'Google Sheets not configured. Showing local data.';
  }
}

async function init(){
  await loadFromSheets();
  const buckets=[...new Set(EVENTS.map(e=>e.bucket).filter(Boolean))].sort();
  const types=[...new Set(EVENTS.map(e=>e.type).filter(Boolean))].sort();
  const tc=document.getElementById('typeChips');
  types.forEach(t=>{
    const col=TYPE_COLOR[t]||DEFAULT_COLOR;
    const chip=document.createElement('button');
    chip.className='fchip'; chip.dataset.type=t;
    chip.innerHTML=`<span class="chip-dot" style="background:${col}"></span><span style="overflow:hidden;text-overflow:ellipsis;">${t}</span>`;
    chip.onclick=()=>toggleType(t,col,chip);
    tc.appendChild(chip);
  });
  const bc=document.getElementById('bucketChips');
  buckets.forEach(b=>{
    const chip=document.createElement('button');
    chip.className='fchip-type'; chip.dataset.bucket=b;
    chip.textContent=b;
    chip.onclick=()=>toggleBucket(b,chip);
    bc.appendChild(chip);
  });
  render();
}

async function refreshSheets() {
  const btn = document.getElementById('btnRefresh');
  if (btn) { btn.textContent = '↻ Syncing...'; btn.disabled = true; }
  // Clear sidebar chips so they rebuild with fresh data
  document.getElementById('typeChips').innerHTML = '';
  document.getElementById('bucketChips').innerHTML = '';
  activeBuckets.clear(); activeTypes.clear();
  await init();
  if (btn) { btn.textContent = '↻ Sync'; btn.disabled = false; }
}

function openEditModal(){
  if(!_currentEvent) return;
  const e = _currentEvent;
  _editIndex = EVENTS.indexOf(e);
  document.getElementById('formModalEyebrow').textContent = 'Edit Event';
  document.getElementById('formModalTitle').textContent = 'Edit Event';
  document.getElementById('formSubmitBtn').textContent = 'Save Changes';
  document.getElementById('fDate').value = e.date || '';
  document.getElementById('fTitle').value = e.title || '';
  document.getElementById('fBucket').value = e.bucket || 'General';
  document.getElementById('fType').value = e.type || 'Email';
  document.getElementById('fAudience').value = e.audience === '—' ? '' : (e.audience || '');
  document.getElementById('fNotes').value = e.notes || '';
  document.getElementById('fStat').value = e.status || 'Planned';

  document.getElementById('formModalBg').classList.add('open');
}

function closeFormModal(){
  document.getElementById('formModalBg').classList.remove('open');
}
function closeFormMaybe(e){
  if(e.target === document.getElementById('formModalBg')) closeFormModal();
}

function submitEventForm(){
  const date = document.getElementById('fDate').value;
  const title = document.getElementById('fTitle').value.trim();
  if(!date || !title){ alert('Date and Title are required.'); return; }
  const ev = {
    date,
    bucket: document.getElementById('fBucket').value,
    type:   document.getElementById('fType').value,
    title,
    audience: document.getElementById('fAudience').value.trim() || '—',
    notes:    document.getElementById('fNotes').value.trim(),
    status:   document.getElementById('fStat').value,
  };
  if(_editIndex > -1){
    EVENTS.splice(_editIndex, 1, ev);
  } else {
    EVENTS.push(ev);
    EVENTS.sort((a,b) => a.date.localeCompare(b.date));
  }
  closeFormModal();
  render();
}

function openDeleteConfirm(){
  if(!_currentEvent) return;
  document.getElementById('confirmMsg').textContent = '"' + _currentEvent.title + '" on ' + _currentEvent.date;
  document.getElementById('confirmBg').classList.add('open');
}
function closeConfirm(){
  document.getElementById('confirmBg').classList.remove('open');
}
function confirmDelete(){
  if(!_currentEvent) return;
  const idx = EVENTS.indexOf(_currentEvent);
  if(idx > -1) EVENTS.splice(idx, 1);
  closeConfirm();
  closeModal();
  _currentEvent = null;
  render();
}

function exportHTML(){
  const eventsJSON = JSON.stringify(EVENTS, null, 0);
  const doc = document.documentElement.outerHTML;
  // Replace the EVENTS array in the exported HTML
  const updated = doc.replace(/const EVENTS = \[.*?\];/s, 'const EVENTS = ' + eventsJSON + ';');
  const blob = new Blob([updated], {type: 'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'BRYCER_Calendar_Updated.html';
  a.click();
  URL.revokeObjectURL(a.href);
}
