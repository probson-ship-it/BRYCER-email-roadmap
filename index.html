<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BRYCER 2026 Content Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#03233D;
  --orange:#E17F49;
  --bg:#F4F7FB;
  --card:#FFFFFF;
  --surface2:#F8FAFC;
  --border:#E2E8F0;
  --border2:#CBD5E1;
  --text:#0F172A;
  --muted:#64748B;
  --dim:#94A3B8;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Lato',system-ui,sans-serif;}

/* HEADER */
.hdr{background:var(--navy);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:200;}
.logo{display:flex;flex-direction:column;justify-content:center;gap:0;}
.logo-mark{width:36px;height:36px;border-radius:8px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem;color:#fff;}
.logo-text{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;color:#fff;}
.logo-text span{color:var(--orange);}
.logo-sub{font-size:.65rem;color:rgba(255,255,255,.4);font-family:'DM Mono',monospace;margin-top:1px;letter-spacing:.08em;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.view-seg{display:flex;border:1px solid rgba(255,255,255,.2);border-radius:8px;overflow:hidden;}
.view-btn{font-family:'Syne',sans-serif;font-size:.75rem;font-weight:600;padding:7px 16px;border:none;background:transparent;color:rgba(255,255,255,.5);cursor:pointer;transition:all .15s;letter-spacing:.06em;}
.view-btn.active{background:var(--orange);color:#fff;}
.total-pill{font-family:'DM Mono',monospace;font-size:.72rem;background:rgba(225,127,73,.2);color:var(--orange);border:1px solid rgba(225,127,73,.4);padding:4px 12px;border-radius:999px;white-space:nowrap;}

/* CONTROLS */
.ctrl-bar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 32px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:64px;z-index:199;box-shadow:0 1px 4px rgba(2,6,23,.05);}
.ctrl-group{display:flex;align-items:center;gap:7px;}
.ctrl-label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;}
.spacer{flex:1;}

/* Search input */
input[type=text]{font-family:'Lato',sans-serif;font-size:.8rem;padding:6px 10px;background:#fff;border:1px solid var(--border2);border-radius:7px;color:var(--text);outline:none;transition:border-color .12s;}
input:focus{border-color:var(--orange);}

/* Status select */
select{font-family:'Lato',sans-serif;font-size:.8rem;padding:6px 10px;background:#fff;border:1px solid var(--border2);border-radius:7px;color:var(--text);outline:none;cursor:pointer;transition:border-color .12s;}
select:focus{border-color:var(--orange);}

.btn-reset{font-family:'Syne',sans-serif;font-size:.73rem;font-weight:600;padding:6px 14px;border:1px solid var(--border2);border-radius:7px;background:#fff;color:var(--muted);cursor:pointer;transition:all .12s;}
.btn-reset:hover{border-color:var(--orange);color:var(--orange);}

/* Month nav */
.mnav{display:flex;align-items:center;border:1px solid var(--border2);border-radius:8px;overflow:hidden;}
.mnav-btn{font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700;padding:6px 13px;border:none;background:#fff;color:var(--navy);cursor:pointer;transition:background .12s;}
.mnav-btn:hover{background:var(--bg);}
.mnav-label{padding:6px 16px;font-family:'Syne',sans-serif;font-size:.82rem;font-weight:700;color:var(--navy);white-space:nowrap;min-width:150px;text-align:center;background:var(--surface2);border-left:1px solid var(--border2);border-right:1px solid var(--border2);}

/* ── FILTER CHIPS (multi-select) ──────────────────────────────────────── */
.filter-section{background:var(--card);border-bottom:1px solid var(--border);padding:10px 32px;}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;}
.filter-row:last-child{margin-bottom:0;}
.filter-section-label{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;min-width:70px;}
.fchip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.72rem;font-weight:600;
  padding:4px 10px;border-radius:999px;
  border:1.5px solid var(--border2);
  background:#fff;color:var(--muted);
  cursor:pointer;transition:all .12s;
  white-space:nowrap;user-select:none;
  line-height:1;
}
.fchip:hover{border-color:var(--border2);box-shadow:0 1px 5px rgba(2,6,23,.09);color:var(--text);}
.fchip.active{color:#fff;border-color:transparent;}
.fchip .chip-dot{width:7px;height:7px;border-radius:999px;flex-shrink:0;opacity:.85;}
.fchip.active .chip-dot{opacity:1;background:rgba(255,255,255,.5)!important;}
.leg-divider{width:1px;height:18px;background:var(--border);margin:0 2px;flex-shrink:0;}

/* CALENDAR */
.cal-wrap{padding:20px 32px 40px;}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
.dow-cell{text-align:center;padding:6px 4px;font-family:'Syne',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
.dow-cell.is-wed{color:var(--orange);}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.day-cell{background:var(--card);border:1px solid var(--border);border-radius:10px;min-height:128px;padding:8px 7px;transition:border-color .12s,box-shadow .12s;position:relative;overflow:hidden;}
.day-cell:hover{border-color:var(--border2);box-shadow:0 4px 16px rgba(2,6,23,.07);}
.day-cell.other-month{background:var(--surface2);opacity:.5;}
.day-cell.today{border-color:var(--orange);box-shadow:0 0 0 2px rgba(225,127,73,.15);}
.day-cell.today::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--orange);border-radius:10px 10px 0 0;}
.day-cell.is-wed-cell{background:#FFFDF8;}
.day-num{font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700;color:var(--navy);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.today-badge{font-family:'DM Mono',monospace;font-size:.52rem;font-weight:500;background:var(--orange);color:#fff;padding:1px 5px;border-radius:3px;letter-spacing:.04em;}
.wed-dot{width:5px;height:5px;border-radius:999px;background:var(--orange);opacity:.35;flex-shrink:0;}
.ev-pill{font-size:.63rem;line-height:1.3;padding:3px 6px 3px 8px;border-radius:5px;margin-bottom:3px;cursor:pointer;border-left:3px solid transparent;background:var(--surface2);color:var(--text);transition:all .1s;display:block;overflow:hidden;}
.ev-pill:hover{filter:brightness(.96);transform:translateX(1px);}
.ev-pill.filtered-out{display:none;}
.ev-type-label{font-family:'DM Mono',monospace;font-size:.54rem;opacity:.55;display:block;margin-bottom:1px;text-transform:uppercase;letter-spacing:.07em;}
.ev-title-text{font-weight:700;display:block;color:var(--navy);}
.more-tag{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--dim);cursor:pointer;padding:2px 5px;border-radius:4px;display:inline-block;margin-top:2px;background:var(--bg);}
.more-tag:hover{color:var(--muted);}

/* LIST VIEW */
.list-wrap{padding:24px 32px 48px;}
.list-month-block{margin-bottom:32px;}
.list-month-hdr{display:flex;align-items:baseline;gap:12px;font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800;color:var(--navy);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--orange);}
.list-month-hdr small{font-size:.72rem;font-weight:400;color:var(--dim);font-family:'DM Mono',monospace;}
.list-thead{display:grid;grid-template-columns:80px 170px 130px 1fr 140px 90px;gap:10px;padding:5px 12px;font-family:'DM Mono',monospace;font-size:.62rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.list-row{display:grid;grid-template-columns:80px 170px 130px 1fr 140px 90px;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:all .12s;align-items:center;margin-bottom:3px;background:#fff;}
.list-row:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(2,6,23,.06);}
.lcol-date{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--dim);}
.lcol-bucket{font-size:.74rem;font-weight:700;}
.lcol-title{font-size:.82rem;font-weight:600;color:var(--text);line-height:1.3;}
.lcol-audience{font-size:.73rem;color:var(--muted);}
.type-badge,.status-badge{font-family:'DM Mono',monospace;font-size:.65rem;font-weight:500;padding:3px 8px;border-radius:999px;border:1px solid transparent;display:inline-block;}

.tb-Email            {background:#DBEAFE;color:#1E3A8A;border-color:#93C5FD;}
.tb-Blog             {background:#FDE8F0;color:#9D174D;border-color:#F9A8D4;}
.tb-Social           {background:#FEF3C7;color:#78350F;border-color:#FCD34D;}
.tb-Newsletter       {background:#DCFCE7;color:#14532D;border-color:#6EE7B7;}
.tb-Drip-Email       {background:#FAE8FF;color:#701A75;border-color:#E879F9;}
.tb-Webinar          {background:#EDE9FE;color:#3730A3;border-color:#A5B4FC;}
.tb-Internal-Email   {background:#F1F5F9;color:#334155;border-color:#94A3B8;}
.tb-Internal-Training{background:#E2E8F0;color:#1E293B;border-color:#94A3B8;}
.tb-Service-Launch   {background:#D1FAE5;color:#064E3B;border-color:#34D399;}
.tb-Conference       {background:#E0E7FF;color:#312E81;border-color:#818CF8;}
.tb-Speaking-Engagement{background:#FFF7ED;color:#7C2D12;border-color:#FB923C;}
.tb-Podcast          {background:#CFFAFE;color:#164E63;border-color:#22D3EE;}
.tb-Holiday          {background:#CCFBF1;color:#134E4A;border-color:#2DD4BF;}
.tb-WFCA-ad          {background:#FEF9C3;color:#713F12;border-color:#EAB308;}
.tb-Press-Release    {background:#E0F2FE;color:#0C4A6E;border-color:#38BDF8;}
.tb-default          {background:#F1F5F9;color:#475569;border-color:#CBD5E1;}

.sb-Sent     {background:#DCFCE7;color:#14532D;border-color:#86EFAC;}
.sb-Scheduled{background:#FEF3C7;color:#92400E;border-color:#FDE68A;}
.sb-Planned  {background:#DBEAFE;color:#1E40AF;border-color:#BFDBFE;}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(6px);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border:1px solid var(--border2);border-radius:16px;max-width:500px;width:100%;padding:28px;position:relative;box-shadow:0 24px 60px rgba(2,6,23,.15);animation:modalIn .18s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.modal-x{position:absolute;top:12px;right:12px;width:28px;height:28px;background:none;border:none;cursor:pointer;font-size:1rem;color:var(--dim);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.modal-x:hover{color:var(--text);background:var(--bg);}
.modal-eyebrow{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--dim);margin-bottom:6px;letter-spacing:.06em;}
.modal-title{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:700;color:var(--navy);line-height:1.35;margin-bottom:14px;}
.modal-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.modal-divider{border:none;border-top:1px solid var(--border);margin:14px 0;}
.modal-field{margin-bottom:12px;}
.modal-field-label{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.modal-field-val{font-size:.84rem;color:var(--muted);line-height:1.5;}

@media(max-width:900px){
  .hdr,.ctrl-bar,.filter-section,.cal-wrap,.list-wrap{padding-left:14px;padding-right:14px;}
  .list-thead,.list-row{grid-template-columns:70px 1fr 90px;}
  .list-thead .lh-bucket,.list-row .lcol-bucket,
  .list-thead .lh-audience,.list-row .lcol-audience,
  .list-thead .lh-type,.list-row .lcol-type-col{display:none;}
}
</style>
</head>

};
const DEFAULT_COLOR = '#94A3B8';

function typeSlug(t){return(t||'').replace(/[^a-zA-Z0-9]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')||'default';}

const TODAY=new Date();TODAY.setHours(0,0,0,0);
let curMonth=TODAY.getMonth(),curYear=TODAY.getFullYear();
let activeBuckets=new Set(), activeTypes=new Set();
let fStatus='', fSearch='', activeView='cal';

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function init(){
  const buckets=[...new Set(EVENTS.map(e=>e.bucket).filter(Boolean))].sort();
  const types=[...new Set(EVENTS.map(e=>e.type).filter(Boolean))].sort();

  // Build bucket chips
  const bc=document.getElementById('bucketChips');
  buckets.forEach(b=>{
    const col=BUCKET_COLOR[b]||DEFAULT_COLOR;
    const chip=document.createElement('button');
    chip.className='fchip'; chip.dataset.bucket=b;
    chip.innerHTML=`<span class="chip-dot" style="background:${col}"></span>${b}`;
    chip.onclick=()=>toggleBucket(b,col,chip);
    bc.appendChild(chip);
  });

  // Build type chips
  const tc=document.getElementById('typeChips');
  types.forEach(t=>{
    const slug=typeSlug(t);
    const chip=document.createElement('button');
    chip.className='fchip'; chip.dataset.type=t;
    // Use a small colored square matching the badge color
    chip.innerHTML=`<span class="type-badge tb-${slug}" style="padding:1px 6px;font-size:.58rem;border:none;">${t}</span>`;
    chip.onclick=()=>toggleType(t,chip);
    tc.appendChild(chip);
  });

  render();
}

function toggleBucket(b, col, chip){
  if(activeBuckets.has(b)){
    activeBuckets.delete(b);
    chip.classList.remove('active');
    chip.style.background='';
    chip.style.color='';
  } else {
    activeBuckets.add(b);
    chip.classList.add('active');
    chip.style.background=col;
    chip.style.color='#fff';
  }
  applyFilters();
}

function toggleType(t, chip){
  if(activeTypes.has(t)){
    activeTypes.delete(t);
    chip.classList.remove('active');
    chip.style.background='';
    chip.style.color='';
  } else {
    activeTypes.add(t);
    chip.classList.add('active');
    chip.style.background=var_navy();
    chip.style.color='#fff';
  }
  applyFilters();
}

function var_navy(){ return '#03233D'; }

function applyFilters(){
  fStatus=document.getElementById('fStatus').value;
  fSearch=document.getElementById('fSearch').value.toLowerCase().trim();
  render();
}

function resetFilters(){
  activeBuckets.clear(); activeTypes.clear();
  fStatus=''; fSearch='';
  document.getElementById('fStatus').value='';
  document.getElementById('fSearch').value='';
  document.querySelectorAll('.fchip').forEach(c=>{
    c.classList.remove('active');
    c.style.background='';
    c.style.color='';
  });
  render();
}

function passes(e){
  if(activeBuckets.size>0 && !activeBuckets.has(e.bucket)) return false;
  if(activeTypes.size>0   && !activeTypes.has(e.type))     return false;
  if(fStatus && e.status!==fStatus) return false;
  if(fSearch && !((e.title||'').toLowerCase().includes(fSearch)||(e.bucket||'').toLowerCase().includes(fSearch)||(e.audience||'').toLowerCase().includes(fSearch)||(e.notes||'').toLowerCase().includes(fSearch))) return false;
  return true;
}

function render(){
  const visible=EVENTS.filter(passes);
  document.getElementById('totalPill').textContent=visible.length+' item'+(visible.length!==1?'s':'');
  document.getElementById('mnLabel').textContent=MONTHS[curMonth]+' '+curYear;
  if(activeView==='cal') renderCal();
  else renderList(visible);
}

function renderCal(){
  const byDate={};
  EVENTS.forEach(e=>{if(!byDate[e.date])byDate[e.date]=[];byDate[e.date].push(e);});
  const grid=document.getElementById('dayGrid'); grid.innerHTML='';
  const first=new Date(curYear,curMonth,1).getDay();
  const days=new Date(curYear,curMonth+1,0).getDate();
  const prevDays=new Date(curYear,curMonth,0).getDate();

  for(let i=0;i<first;i++){
    const c=document.createElement('div');c.className='day-cell other-month';
    c.innerHTML=`<div class="day-num">${prevDays-first+i+1}</div>`;grid.appendChild(c);
  }

  for(let d=1;d<=days;d++){
    const ds=curYear+'-'+String(curMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dt=new Date(curYear,curMonth,d);
    const isToday=dt.getTime()===TODAY.getTime();
    const isWed=dt.getDay()===3;
    const cell=document.createElement('div');
    cell.className='day-cell'+(isToday?' today':'')+(isWed?' is-wed-cell':'');
    let html=`<div class="day-num">${d}${isToday?'<span class="today-badge">TODAY</span>':(isWed?'<span class="wed-dot"></span>':'')}</div>`;
    const entries=byDate[ds]||[];
    const visEntries=entries.filter(passes);
    entries.forEach(ev=>{
      const col=BUCKET_COLOR[ev.bucket]||DEFAULT_COLOR;
      const isVis=passes(ev);
      const short=ev.title.length>44?ev.title.slice(0,44)+'…':ev.title;
      html+=`<div class="ev-pill${isVis?'':' filtered-out'}" style="border-left-color:${col};background:${col}14;" onclick="openModal(${encodeEv(ev)})">
        <span class="ev-type-label">${ev.type}</span>
        <span class="ev-title-text">${short}</span>
      </div>`;
    });
    if(visEntries.length>3) html+=`<span class="more-tag" onclick="showDateList('${ds}')">+${visEntries.length-3} more</span>`;
    cell.innerHTML=html; grid.appendChild(cell);
  }

  const total=first+days;
  const rem=total%7===0?0:7-(total%7);
  for(let i=1;i<=rem;i++){
    const c=document.createElement('div');c.className='day-cell other-month';
    c.innerHTML=`<div class="day-num">${i}</div>`;grid.appendChild(c);
  }
}

function showDateList(ds){
  const d=new Date(ds+'T00:00:00');
  curMonth=d.getMonth(); curYear=d.getFullYear();
  setView('list');
}

function renderList(visible){
  const body=document.getElementById('listBody'); body.innerHTML='';
  const groups={};
  visible.forEach(e=>{
    if(!e.date||e.date.length<7)return;
    const k=e.date.slice(0,7);
    if(!groups[k])groups[k]=[];
    groups[k].push(e);
  });
  const keys=Object.keys(groups).sort();
  keys.forEach(k=>{
    const[yr,mo]=k.split('-');
    const items=groups[k].sort((a,b)=>a.date.localeCompare(b.date));
    const block=document.createElement('div'); block.className='list-month-block';
    let html=`<div class="list-month-hdr">${MONTHS[parseInt(mo)-1]} ${yr}<small>${items.length} item${items.length!==1?'s':''}</small></div>`;
    items.forEach(e=>{
      const col=BUCKET_COLOR[e.bucket]||DEFAULT_COLOR;
      const tslug=typeSlug(e.type);
      const dateDisp=MON3[parseInt(e.date.slice(5,7))-1]+' '+parseInt(e.date.slice(8,10));
      html+=`<div class="list-row" style="border-left:3px solid ${col}" onclick="openModal(${encodeEv(e)})">
        <div class="lcol-date">${dateDisp}</div>
        <div class="lcol-bucket" style="color:${col}">${e.bucket}</div>
        <div class="lcol-type-col"><span class="type-badge tb-${tslug}">${e.type}</span></div>
        <div class="lcol-title">${e.title}</div>
        <div class="lcol-audience">${e.audience||'—'}</div>
        <div><span class="status-badge sb-${e.status}">${e.status}</span></div>
      </div>`;
    });
    block.innerHTML=html; body.appendChild(block);
  });
  if(!keys.length) body.innerHTML='<div style="text-align:center;padding:60px;color:var(--dim);font-family:\'DM Mono\',monospace;font-size:.85rem;">No items match the current filters.</div>';
}

function encodeEv(ev){return"'"+JSON.stringify(ev).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'";}
function openModal(evJson){
  const e=typeof evJson==='string'?JSON.parse(evJson):evJson;
  const col=BUCKET_COLOR[e.bucket]||DEFAULT_COLOR;
  const tslug=typeSlug(e.type);
  const dateDisp=e.date?new Date(e.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'}):'';
  document.getElementById('mDate').textContent=dateDisp;
  document.getElementById('mTitle').textContent=e.title;
  document.getElementById('mBucket').innerHTML=`<span style="color:${col};font-weight:700;">${e.bucket}</span>`;
  document.getElementById('mAudience').textContent=e.audience||'—';
  document.getElementById('mNotes').textContent=e.notes||'—';
  document.getElementById('mChips').innerHTML=`<span class="type-badge tb-${tslug}">${e.type}</span><span class="status-badge sb-${e.status}">${e.status}</span>`;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){document.getElementById('modalBg').classList.remove('open');}
function closeMaybe(e){if(e.target===document.getElementById('modalBg'))closeModal();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function changeMonth(d){curMonth+=d;if(curMonth>11){curMonth=0;curYear++;}if(curMonth<0){curMonth=11;curYear--;}render();}
function setView(v){
  activeView=v;
  document.getElementById('viewCal').style.display=v==='cal'?'':'none';
  document.getElementById('viewList').style.display=v==='list'?'':'none';
  document.getElementById('btnCal').classList.toggle('active',v==='cal');
  document.getElementById('btnList').classList.toggle('active',v==='list');
  render();
}
init();
</script>
</body>
</html>
